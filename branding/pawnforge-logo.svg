<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">PawnForge</title>
  <desc id="desc">A modern gold pawn framed by cyan code brackets on a deep navy tile, beside the PawnForge wordmark.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123B5B"/>
      <stop offset="1" stop-color="#07182B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFE6A2"/>
      <stop offset="1" stop-color="#E7A63A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CE7DE"/>
      <stop offset="1" stop-color="#32AFC7"/>
    </linearGradient>
  </defs>

  <g transform="translate(20 20)">
    <rect width="280" height="280" rx="58" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="277" height="277" rx="56.5" fill="none" stroke="#3C7590" stroke-opacity=".45" stroke-width="3"/>
    <path d="M88 76 49 140l39 64M192 76l39 64-39 64" fill="none" stroke="url(#cyan)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="78" r="28" fill="url(#gold)"/>
    <path d="M108 119c7-15 18-22 32-22s25 7 32 22l-9 43 29 40 8 24H89l8-24 29-40z" fill="url(#gold)"/>
    <path d="M97 207h86l18 17v12H79v-12z" fill="#C98A32"/>
    <path d="M112 190h56" stroke="#FFF4D5" stroke-width="5" stroke-linecap="round" opacity=".72"/>
    <path d="M104 231h72" stroke="#FFF4D5" stroke-width="4" stroke-linecap="round" opacity=".42"/>
    <path d="M136 28h8M136 252h8" stroke="#55DCD3" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  </g>

  <g transform="translate(350 0)">
    <text x="0" y="160" font-family="Inter,Manrope,Segoe UI,Arial,sans-serif" font-size="104" font-weight="760" letter-spacing="-5" fill="#F0F5FC">Pawn<tspan fill="#53C9D1">Forge</tspan></text>
    <path d="M4 198h420" stroke="#254867" stroke-width="5" stroke-linecap="round"/>
    <path d="M4 198h120" stroke="#E9B451" stroke-width="5" stroke-linecap="round"/>
    <circle cx="440" cy="198" r="4" fill="#53C9D1"/>
  </g>
